<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Hacks</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .bg-img {
            background-image: url('./backwater.png');
            height: 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .title {
            font-size: 6em;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 50px;
        }

        .btn-container {
            position: absolute;
            bottom: 50px;
            display: flex;
            gap: 20px;
        }

        .btn {
            background-color: #62b0d1;
            border: none;
            color: white;
            padding: 15px 30px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 18px;
            font-weight: bold;
            border-radius: 90px;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .btn-social {
            background-color: #333;
            border: none;
            color: white;
            padding: 15px 30px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 18px;
            font-weight: bold;
            border-radius: 90px;
            transition: background-color 0.3s ease;
        }

        .btn-social:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <div class="bg-img">
        <div class="title">Ocean Hacks</div>
        <div class="subtitle">Register for Ocean Hacks 2024</div>
        <div class="btn-container">
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSf9LzD7EaH4ujRwLNvNhnw-k9e9oGiWJl6XUjNnDJpXPkj4Cg/closedform" class="btn">Register</a>
            <a href="https://www.instagram.com/ocean_hacks/" class="btn-social">Instagram</a>
            <a href="https://discord.gg/VSAY9QndPH" class="btn-social">Discord</a>
        </div>
    </div>
</body>
</html>
